[package]

name = "errno"
version = "0.3.14"
authors = ["Chris Wong <lambda.fairy@gmail.com>", "Dan Gohman <dev@sunfishcode.online>"]

license = "MIT OR Apache-2.0"
# Raised from 2018 with the MSRV: werewolfdb builds on 2021, and inline format captures —
# which the project's coverage discipline depends on, since a positional `assert!` message
# compiles a panic arm no test can reach — are a 2021 feature.
edition = "2021"
documentation = "https://docs.rs/errno"
repository = "https://github.com/lambda-fairy/rust-errno"
description = "Cross-platform interface to the `errno` variable."
categories = ["no-std", "os"]
# Raised from 1.56 by the migration: `core::ffi::c_int` replaced `libc::c_int` and is stable
# since 1.64. This fork is built inside werewolfdb, whose floor is the current stable release
# (see `msrv-policy`), so it declares that rather than the lowest version its own source allows.
rust-version = "1.97"

[target.'cfg(windows)'.dependencies.windows-sys]
version = ">=0.52, <0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
]

[target.'cfg(target_os="wasi")'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(target_os="hermit")'.dependencies]
libc = { version = "0.2", default-features = false }

# The benchmark runs the pre-migration implementation alongside the migrated one, so it needs the
# crate the migration removed. Dev-only, and declared as a `test-exemption` in AGENTS.md: keeping
# the original runnable is the only way to compare against it (capability `migration-benchmarks`).
[dev-dependencies]
criterion = "0.5"
libc = { version = "0.2", default-features = false, features = ["std"] }

[[bench]]
name = "strerror"
harness = false

[features]
default = ["std"]
# `libc/std` is gone with the unix libc dependency; the remaining targets that still use the
# crate declare it themselves and do not need `std` forwarded to it.
std = []

# TODO: Remove this exemption when Cygwin support lands in Rust stable
# https://github.com/rust-lang/rust/pull/134999
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("cygwin"))']
